<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>Option A — Search dropdown · Mobile</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body class="opt-a">
  <div class="app">
    <div class="annotate">
      <span><strong>A · Search law</strong> · mobile dropdown</span>
      <span class="law">Not a live list swap · select → sheet</span>
    </div>
    <header class="chrome" style="padding:0 12px 10px">
      <div class="phone-status"><span>9:41</span><span>Flip Lab</span><span>100%</span></div>
      <div class="brand"><img src="logo.png" alt="" style="width:32px;height:32px" /><div><h1>OSRS Flip Lab</h1><p>Best list still underneath</p></div></div>
      <div class="search" style="margin-top:8px">
        <span class="ph">⌕</span>
        <input value="rune" readonly style="font-size:16px;height:40px" />
        <div class="search-dd">
          <div class="hit"><img class="icon" src="../icons/Nature_rune.png" alt="" /><div>Nature rune</div><em>+8</em></div>
          <div class="hit"><img class="icon" src="../icons/Blood_rune.png" alt="" /><div>Blood rune</div><em>+7</em></div>
          <div class="hit"><img class="icon" src="../icons/Death_rune.png" alt="" /><div>Death rune</div><em>+8</em></div>
        </div>
      </div>
    </header>
    <main class="stage">
      <div class="kpis" style="grid-template-columns:1fr 1fr;padding:8px">
        <div class="kpi gain"><div class="l">Best /h</div><div class="v tabular">184.2k</div><div class="s">Unchanged while typing</div></div>
        <div class="kpi"><div class="l">Fill</div><div class="v">78</div><div class="s">Dragon bones</div></div>
      </div>
      <div style="padding:10px 12px;border-top:1px solid var(--border)" class="row">
        <img class="icon" src="../icons/Dragon_bones.png" alt="" />
        <div><div class="name">Dragon bones</div><div class="sub">List row still here</div></div>
      </div>
    </main>
    <nav class="bottom-nav" style="position:relative">
      <button class="active"><span class="ic">◉</span>Best</button>
      <button><span class="ic">⚡</span>Hot</button>
      <button><span class="ic">✦</span>Alch</button>
      <button><span class="ic">↗</span>Invest</button>
      <button><span class="ic">★</span>Watch</button>
      <button><span class="ic">♨</span>Volume</button>
      <div class="home-ind"></div>
    </nav>
  </div>
</body>
</html>
